[package]
name = "zkp_verifier"
version = "0.1.0"
edition = "2024"

[dependencies]

# For math curves
k256 = { version = "0.13", features = ["arithmetic", "serde", "sha256"] }
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

# Utilities
thiserror = "1.0"
anyhow = "1.0"
ff = "0.13"

# Networking
tokio = { version = "1", features = ["full"]}
futures = "0.3"